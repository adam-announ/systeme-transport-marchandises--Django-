<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Système de Transport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'utilisateurs/css/style.css' %}">
</head>
<body class="register-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-9">
                <div class="register-card">
                    <div class="register-header">
                        <h2 class="mb-0">Créer un compte</h2>
                        <p class="mb-0 mt-2">Système de Transport de Marchandises</p>
                    </div>
                    <div class="register-body">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %} d-flex align-items-center">
                                    {% if message.tags == 'success' %}
                                        <i class="fas fa-check-circle me-2"></i>
                                    {% else %}
                                        <i class="fas fa-exclamation-circle me-2"></i>
                                    {% endif %}
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label for="first_name" class="form-label">Prénom *</label>
                                    <input type="text" class="form-control form-control-lg" id="first_name" name="first_name" required>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="last_name" class="form-label">Nom *</label>
                                    <input type="text" class="form-control form-control-lg" id="last_name" name="last_name" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label for="username" class="form-label">Nom d'utilisateur *</label>
                                    <input type="text" class="form-control form-control-lg" id="username" name="username" required>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="email" class="form-label">Email *</label>
                                    <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label for="password" class="form-label">Mot de passe *</label>
                                    <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="phone" class="form-label">Téléphone</label>
                                    <input type="tel" class="form-control form-control-lg" id="phone" name="phone" placeholder="+33 6 12 34 56 78">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="role" class="form-label">Type de compte *</label>
                                <select class="form-select form-select-lg" id="role" name="role" required>
                                    <option value="">Choisissez votre rôle</option>
                                    <option value="client">Client</option>
                                    <option value="driver">Chauffeur</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100 mb-3">Créer mon compte</button>
                        </form>
                        
                        <div class="text-center">
                            <p class="mb-2">Déjà un compte ?</p>
                            <a href="{% url 'login' %}" class="btn btn-outline-primary">Se connecter</a>
                        </div>
                        
                        <div class="text-center mt-4">
                            <a href="/" class="text-muted">← Retour à l'accueil</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
