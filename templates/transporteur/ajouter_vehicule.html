{% extends 'base.html' %}

{% block title %}Ajouter Véhicule - Transporteur{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-truck"></i> Ajouter un véhicule</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Immatriculation</label>
                        <input type="text" class="form-control" name="immatriculation" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Marque</label>
                            <input type="text" class="form-control" name="marque" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Modèle</label>
                            <input type="text" class="form-control" name="modele" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Année</label>
                            <input type="number" class="form-control" name="annee" min="1990" max="2025" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Type de véhicule</label>
                            <select class="form-control" name="type_vehicule" required>
                                <option value="camionnette">Camionnette</option>
                                <option value="camion">Camion</option>
                                <option value="semi_remorque">Semi-remorque</option>
                                <option value="fourgon">Fourgon</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Capacité poids (kg)</label>
                            <input type="number" class="form-control" name="capacite_poids" step="0.01" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Capacité volume (m³)</label>
                            <input type="number" class="form-control" name="capacite_volume" step="0.01" required>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'transporteur:mes_vehicules' %}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Ajouter</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
