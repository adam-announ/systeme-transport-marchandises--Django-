{% extends 'base.html' %}

{% block title %}Mettre à jour statut - Transporteur{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5>Mettre à jour le statut - {{ mission.numero }}</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Nouveau statut</label>
                        <select class="form-control" name="statut" required>
                            {% if mission.statut == 'confirmee' %}
                            <option value="en_cours">Démarrer la mission</option>
                            {% elif mission.statut == 'en_cours' %}
                            <option value="livree">Confirmer la livraison</option>
                            {% endif %}
                        </select>
                    </div>
                    
                    {% if mission.statut == 'en_cours' %}
                    <div class="mb-3">
                        <label class="form-label">Nom du destinataire</label>
                        <input type="text" class="form-control" name="nom_destinataire" required>
                    </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label class="form-label">Commentaire</label>
                        <textarea class="form-control" name="commentaire" rows="3"></textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'transporteur:mission_detail' mission.id %}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Confirmer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
