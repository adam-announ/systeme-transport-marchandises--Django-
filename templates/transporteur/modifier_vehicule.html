{% extends 'base.html' %}

{% block title %}Modifier Véhicule - Transporteur{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-edit"></i> Modifier le véhicule</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Immatriculation</label>
                        <input type="text" class="form-control" name="immatriculation" value="{{ vehicule.immatriculation }}" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Marque</label>
                            <input type="text" class="form-control" name="marque" value="{{ vehicule.marque }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Modèle</label>
                            <input type="text" class="form-control" name="modele" value="{{ vehicule.modele }}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Année</label>
                            <input type="number" class="form-control" name="annee" value="{{ vehicule.annee }}" min="1990" max="2025" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Type de véhicule</label>
                            <select class="form-control" name="type_vehicule" required>
                                <option value="camionnette" {% if vehicule.type_vehicule == 'camionnette' %}selected{% endif %}>Camionnette</option>
                                <option value="camion" {% if vehicule.type_vehicule == 'camion' %}selected{% endif %}>Camion</option>
                                <option value="semi_remorque" {% if vehicule.type_vehicule == 'semi_remorque' %}selected{% endif %}>Semi-remorque</option>
                                <option value="fourgon" {% if vehicule.type_vehicule == 'fourgon' %}selected{% endif %}>Fourgon</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Capacité poids (kg)</label>
                            <input type="number" class="form-control" name="capacite_poids" value="{{ vehicule.capacite_poids }}" step="0.01" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Capacité volume (m³)</label>
                            <input type="number" class="form-control" name="capacite_volume" value="{{ vehicule.capacite_volume }}" step="0.01" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">État</label>
                            <select class="form-control" name="etat">
                                <option value="excellent" {% if vehicule.etat == 'excellent' %}selected{% endif %}>Excellent</option>
                                <option value="bon" {% if vehicule.etat == 'bon' %}selected{% endif %}>Bon</option>
                                <option value="moyen" {% if vehicule.etat == 'moyen' %}selected{% endif %}>Moyen</option>
                                <option value="reparation" {% if vehicule.etat == 'reparation' %}selected{% endif %}>En réparation</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Disponibilité</label>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="disponible" {% if vehicule.disponible %}checked{% endif %}>
                                <label class="form-check-label">Disponible</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'transporteur:mes_vehicules' %}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
