<!DOCTYPE html>
<html>
<head>
    <title>Système de Transport - Cartes</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
        .controls { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .btn { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Planification des Tournées</h1>
        
        <div class="controls">
            <input type="text" id="depot" placeholder="Adresse du dépôt" style="width: 300px; padding: 8px;">
            <button class="btn" onclick="addDepot()">Définir Dépôt</button>
            
            <input type="text" id="delivery" placeholder="Adresse de livraison" style="width: 300px; padding: 8px;">
            <button class="btn" onclick="addDelivery()">Ajouter Livraison</button>
            
            <button class="btn" onclick="optimizeRoute()">Optimiser Tournée</button>
        </div>
        
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([33.5731, -7.5898], 11);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let depotMarker, deliveryMarkers = [];

        function addDepot() {
            const address = document.getElementById('depot').value;
            if (!address) return;
            
            // Simulation géocodage pour Casablanca
            const lat = 33.5731 + (Math.random() - 0.5) * 0.1;
            const lng = -7.5898 + (Math.random() - 0.5) * 0.1;
            
            if (depotMarker) map.removeLayer(depotMarker);
            depotMarker = L.marker([lat, lng]).addTo(map).bindPopup('Dépôt: ' + address);
            map.setView([lat, lng], 13);
        }

        function addDelivery() {
            const address = document.getElementById('delivery').value;
            if (!address) return;
            
            const lat = 33.5731 + (Math.random() - 0.5) * 0.2;
            const lng = -7.5898 + (Math.random() - 0.5) * 0.2;
            
            const marker = L.marker([lat, lng]).addTo(map).bindPopup('Livraison: ' + address);
            deliveryMarkers.push(marker);
            document.getElementById('delivery').value = '';
        }

        function optimizeRoute() {
            if (!depotMarker || deliveryMarkers.length === 0) {
                alert('Définissez un dépôt et des livraisons');
                return;
            }
            
            const points = [depotMarker.getLatLng(), ...deliveryMarkers.map(m => m.getLatLng())];
            L.polyline(points, {color: 'red'}).addTo(map);
            alert('Tournée optimisée (simulation)');
        }
    </script>
</body>
</html>
