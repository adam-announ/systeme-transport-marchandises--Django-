{% extends 'base.html' %}

{% block title %}Modifier Utilisateur - Administrateur{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2><i class="fas fa-user-edit"></i> Modifier l'utilisateur: {{ user_obj.username }}</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">Prénom</label>
                            <input type="text" class="form-control" name="first_name" 
                                   id="first_name" value="{{ user_obj.first_name }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Nom</label>
                            <input type="text" class="form-control" name="last_name" 
                                   id="last_name" value="{{ user_obj.last_name }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" class="form-control" name="email" 
                               id="email" value="{{ user_obj.email }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="role" class="form-label">Rôle *</label>
                        <select class="form-control" name="role" id="role" required>
                            <option value="client" {% if user_obj.role == 'client' %}selected{% endif %}>Client</option>
                            <option value="transporteur" {% if user_obj.role == 'transporteur' %}selected{% endif %}>Transporteur</option>
                            <option value="planificateur" {% if user_obj.role == 'planificateur' %}selected{% endif %}>Planificateur</option>
                            <option value="admin" {% if user_obj.role == 'admin' %}selected{% endif %}>Administrateur</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="telephone" class="form-label">Téléphone</label>
                        <input type="tel" class="form-control" name="telephone" 
                               id="telephone" value="{{ user_obj.telephone }}">
                    </div>
                    
                    <div class="mb-3">
                        <label for="adresse" class="form-label">Adresse</label>
                        <textarea class="form-control" name="adresse" id="adresse" rows="2">{{ user_obj.adresse }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="actif" 
                                   id="actif" {% if user_obj.actif %}checked{% endif %}>
                            <label class="form-check-label" for="actif">
                                Compte actif
                            </label>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'admin_panel:gestion_utilisateurs' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Retour
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
